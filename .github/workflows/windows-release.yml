name: Windows release build

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6.6 (MSVC 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          arch: "win64_msvc2019_64"
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.4

      - name: Configure (CMake, Release, MSVC)
        shell: bash
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DORION_BUILD_GUI=ON
          -DORION_BUILD_DIAGNOSTICS=ON
          -DORION_BUILD_STORAGE=ON
          -DORION_BUILD_NETSCAN=ON
          -DORION_BUILD_TESTS=OFF

      - name: Build ORION.exe
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Locate the built exe
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Include "orion.exe", "ORION.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Host "--- DEBUG: Список файлов в папке build ---"
            Get-ChildItem -Path build -Recurse | Select-Object FullName
            throw "Исполняемый файл не найден под build/. Проверь лог выше."
          }

          Write-Host "Found: $($exe.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName -Destination dist\ORION.exe

      - name: Bundle Qt DLLs + MSVC runtime (windeployqt)
        shell: pwsh
        run: |
          windeployqt --release --compiler-runtime dist\ORION.exe

      - name: Zip the distributable folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ORION-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORION-windows
          path: ORION-windows.zip
          retention-days: 30
