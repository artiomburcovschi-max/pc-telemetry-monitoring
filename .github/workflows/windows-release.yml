name: Windows release build

# Builds a self-contained Windows ORION.exe (Qt DLLs + MSVC runtime bundled
# next to it) and uploads it as a downloadable artifact — no local Windows
# machine or Qt install needed to get a file you can hand to someone else.
#
# Run it: push this repo to GitHub (or push a change), open the "Actions" tab,
# wait for the run to go green, then open the run and download the
# "ORION-windows" artifact at the bottom of the page. It's a zip containing
# ORION.exe plus every DLL it needs.
#
# You can also trigger it by hand: Actions tab -> "Windows release build" ->
# "Run workflow".

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6.6 (MSVC 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          arch: "win64_msvc2019_64"
          cache: true

      - name: Configure (CMake, Release)
        run: >
          cmake -S . -B build
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DORION_BUILD_GUI=ON
          -DORION_BUILD_DIAGNOSTICS=ON
          -DORION_BUILD_STORAGE=ON
          -DORION_BUILD_NETSCAN=ON
          -DORION_BUILD_TESTS=OFF

      - name: Build ORION.exe
        run: cmake --build build --config Release --parallel

      - name: Locate the built exe
        id: locate
        shell: pwsh
        run: |
          # Умный поиск файла без привязки к регистру букв (ищет orion.exe или ORION.exe)
          $exe = Get-ChildItem -Path build -Recurse -Include "orion.exe", "ORION.exe" | Select-Object -First 1
          
          if (-not $exe) { 
              Write-Host "--- DEBUG: Список файлов в папке build ---"
              Get-ChildItem -Path build -Recurse | Select-Object FullName
              throw "Исполняемый файл не найден под build/. Проверь лог выше." 
          }
          
          Write-Host "Found: $($exe.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          
          # Копируем файл в рабочую папку сборщика деплоя и принудительно даем ему имя большими буквами
          Copy-Item $exe.FullName -Destination dist\ORION.exe

      - name: Bundle Qt DLLs + MSVC runtime (windeployqt)
        shell: pwsh
        run: |
          windeployqt --release --compiler-runtime dist\ORION.exe

      - name: Zip the distributable folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ORION-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORION-windows
          path: ORION-windows.zip
          retention-days: 30
